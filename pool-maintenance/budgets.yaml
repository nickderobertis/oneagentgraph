schema_version: 1
budgets:
  - id: oneagentgraph-pool-maintenance-seconds
    description: >-
      Wall-clock seconds one steady-state pass of this repository's declared pool
      maintenance takes over one ordinary run's worth of superseded builds. It is how
      long a regular post-run pass holds one of this repository's warm slots out of
      service.
    labels: [host]
    measure: reported
    command: [./measure.sh]
    unit: seconds
    direction: max
    threshold: 20
    timeout_seconds: 3600
