# cargo-deny policy. Strict by default: advisories, licenses, bans, and sources
# all fail the check rather than warn. Any exception below is explicit and
# carries a reason so the policy never silently accumulates debt. Run via
# `just deps-check` and a dedicated CI job (it needs a network advisory DB), not
# the core `just check` gate.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this MIT-licensed crate. Adding a
# dependency with a new license fails the check until it is reviewed and added
# here, so the list stays a reviewed record rather than a wish list.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Reviewed with the TLS stack a remote graph/persona ref is fetched over
    # (`ureq` → `rustls`): ISC covers `ring` and `rustls-webpki`, BSD-3-Clause
    # `subtle`, and CDLA-Permissive-2.0 the `webpki-roots` trust store. All four
    # are permissive, attribution-only, and impose no term this MIT crate cannot
    # carry downstream.
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # Reviewed with `oneharness-core`, whose typed report/stream contract this
    # crate parses the oneharness boundary into: MIT-0 covers `borrow-or-share`,
    # reached through `jsonschema` → `referencing` → `fluent-uri`. It is MIT
    # without even the attribution clause — strictly weaker than the `MIT` above,
    # and so imposes no term this MIT crate cannot carry downstream.
    "MIT-0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No `allow-git`, deliberately. Every dependency in this graph resolves from
# crates.io, so the tree is reproducible from the registry alone rather than from
# whichever host happened to have a checkout — and `unknown-git = "deny"` above
# is what keeps it that way. `onejudge` was the one exception while the APIs this
# crate supervises through were merged but unreleased; 0.3.5 carries them, so the
# exception is gone. Re-adding one is a decision this file has to record.
