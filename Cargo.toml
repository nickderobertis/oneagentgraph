[workspace]
# One member today — the crate at the root. Declared explicitly so a second
# crate (a future runtime, a test-support crate) joins the graph by being listed
# here rather than by changing what `--workspace` means.
members = ["."]
resolver = "2"

[package]
name = "oneagentgraph"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
description = "Compose agents into a graph over oneharness/onejudge and merge their outputs into one event stream."
license = "MIT"
repository = "https://github.com/nickderobertis/oneagentgraph"
homepage = "https://github.com/nickderobertis/oneagentgraph"
readme = "README.md"
keywords = ["agents", "orchestration", "cli", "ndjson", "llm"]
categories = ["command-line-utilities", "development-tools"]
# What a crates.io consumer receives: the sources, the manifest, the readme, the
# licence, and the contract the API is written against — `tests/contract.rs`
# reads `docs/contract.md`, so shipping the code without it would ship a crate
# whose own test cannot run. Excludes the CLAUDE.md/AGENTS.md symlink (registries
# reject symlinks), CI config, and the packaging scaffolding.
include = [
  "src/**/*.rs",
  "tests/**/*.rs",
  # The `record.json` goldens `tests/record.rs` reads. Shipping the test
  # without them would ship a crate whose own test cannot run, exactly as for
  # `docs/contract.md` below.
  "tests/golden/*.json",
  "personas/**/*.yaml",
  # Anchored with a leading `/`, every one of them. These are gitignore-style
  # patterns: one with no separator in it matches at *any* depth, so a bare
  # `README.md` and `LICENSE` matched every vendored copy under `node_modules`
  # and shipped 154 files of somebody else's package — and their licences — to
  # crates.io. `/docs/contract.md` already carried the slash for this reason;
  # the rest did not.
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/docs/contract.md",
  # Read the same way, by `tests/persona_format.rs`: the published persona
  # format drives the types it documents.
  "/docs/persona-format.md",
  # And the same way again, by `tests/release_declaration.rs`: the release
  # declaration is handed to onevcs's own reader, so a package without it is a
  # crate whose own test cannot run.
  "/release-targets.toml",
  # And once more, by `tests/e2e/support.rs`: the `oneharness` release the e2e
  # suite drives is the one this file pins, read from it rather than copied.
  "/justfile",
]

[[bin]]
name = "oneagentgraph"
path = "src/main.rs"

# The deterministic programs the e2e suite drives as real subprocesses: one stands
# in for a paid harness CLI at oneharness's own `ONEHARNESS_BIN_<ID>` seam, one
# speaks onejudge's `CommandProvider` JSON-lines protocol, one is the `llmlint`
# CLI a graph's `kind: llmlint` judge names as its `bin`, and one is a program a
# journey's graph points a `pre_turn` view at. All are behind `test-doubles` so a
# published `cargo install oneagentgraph` never builds them.
[[bin]]
name = "oneagentgraph-fake-harness"
path = "src/bin/fake_harness.rs"
required-features = ["test-doubles"]

[[bin]]
name = "oneagentgraph-fake-provider"
path = "src/bin/fake_provider.rs"
required-features = ["test-doubles"]

# The `llmlint` an llmlint judge runs, on the view double's terms: a `bin` is an
# argv the graph supplies, so this is the *input* to that judge rather than a
# stand-in for any part of the engine that runs it — see the binary's own
# documentation.
# llmlint: ignore[new_command_or_client_gets_its_own_project] not a command the
# tool exposes and not a client of anything: a test double the e2e suite spawns,
# built only under `test-doubles` (a `cargo install oneagentgraph` never has it),
# declared the way the three doubles above it already are. Its own project would
# split one suite's fixtures across two graph nodes for no `nx affected` gain —
# every change that touches it is a change to the journeys that drive it.
[[bin]]
name = "oneagentgraph-fake-llmlint"
path = "src/bin/fake_llmlint.rs"
required-features = ["test-doubles"]

# The program a journey's graph declares as a `pre_turn` view. Not a seam: a view
# is an argv the operator supplies, so this is the *input* to that capability
# rather than a stand-in for any part of it — see the binary's own documentation.
[[bin]]
name = "oneagentgraph-fake-view"
path = "src/bin/fake_view.rs"
required-features = ["test-doubles"]

[lib]
name = "oneagentgraph"
path = "src/lib.rs"

[features]
# What only the suite needs: the deterministic programs it spawns — a
# paid-harness stand-in, a onejudge `CommandProvider` backend, an `llmlint` for a
# graph's llmlint judge to name, and a program a journey points a `pre_turn`
# view at — and `judge`'s `hold_between_turns`, the
# one fixture that pauses real code rather than standing in for a process,
# because the conversation boundary it holds is reachable from nowhere else.
# Non-default, so none of it is ever in a consumer's build; `just check` and the
# coverage run enable them.
test-doubles = []

[dependencies]
# The two-party conversation, driven **in this process** rather than by spawning
# `onejudge run`. `cli` is what carries the YAML config surface a graph member
# generates (`Config`/`Plan`) and the run driver over it
# (`run_plan_streaming`), so this crate composes onejudge's own loop instead of
# re-implementing it around `Engine`.
#
# 0.3.5 is the floor, and not for taste: it is the first release carrying the
# three things this crate's supervision is built on, each absent from 0.3.4.
# Lowering this requirement below 0.3.5 does not merely lose a nicety — it stops
# compiling, and the one that would still compile is the worst of the three:
#
#   1. `run_plan_streaming*` — a typed live event sink over the same driver a
#      `Format::Json` run uses. 0.3.4 streamed only under `Format::Human`, and
#      the JSON run — the one whose report this crate needs — was buffered, so
#      its events arrived when the run ended and the activity watchdog had
#      nothing to watch for the whole of the turn it was watching.
#   2. A *typed* event. 0.3.4's callback was `&mut dyn FnMut(&str)` and received
#      an already-rendered line ("· turn 3 — …"), so `turn-started` and
#      `turn-activity` could only have been rebuilt by parsing prose back apart —
#      the exact string-scraping this conversion exists to delete.
#   3. `RunFailure`, which did not exist in 0.3.4 at all. It carries `telemetry`
#      off a run that produced **no** report, and is the only route to
#      `fallback-advanced` for a failed two-party member — precisely when an
#      operator needs to know which subscription refused.
#
# 0.3.7 raises that floor for a fourth, and the reason is the same shape: driving
# onejudge in-process silently took away the OS grouping a subprocess hop gave
# for free, because the harnesses are now spawned by *this* process. 0.3.7 is the
# first release where `Plan::with_spawn_hook` reaches that seam from the plan this
# crate actually drives — 0.3.6 exposed it only on a provider built by hand — so
# it is what lets `crate::judge` put both sides of a two-party member into the
# group `cancel --kill` terminates. Below 0.3.7 that call does not exist, and a
# Windows two-party member has no job object for a cancel to find.
#
# 0.3.8 raises it a fifth time, for `interrupt`: it is the first release that can
# *ask* for a controllable agent turn (`provider.control`) and the first whose
# report carries `control: {session, session_dir, cwd}` — the address an
# `oneharness interrupt` process redirects that turn through, and the `null` that
# tells a supervisor there is no lever. Below 0.3.8 the config key is rejected and
# `Report::control` does not exist, so `crate::control` does not compile.
#
# 0.4.0 is the sixth raise and the only one of them that is not a compile floor:
# every call above still resolves against 0.3.8. It is taken because the loop it
# fixes is one *this* process now runs — a supervisor turn that produced no work
# did not settle, and in-process that is a member sitting until this crate's own
# activity watchdog condemns it rather than a subprocess reporting a finished
# turn. The behaviour is onejudge's and so is its coverage; what is decided here
# is only that a graph links the release carrying it.
# llmlint: ignore-block[changed_behavior_has_e2e] these releases change
# dependency-owned behavior rather than this crate's logic: onejudge's settling
# loop and oneharness-core's event parser are driven and covered by their own
# suites. Recreating either here would assert an upstream implementation through
# a timing race or parser fixture; this crate's existing real journeys and gate
# instead prove that the linked libraries still satisfy its public boundary.
#
# 0.5.0 is the seventh raise and a compile floor again: it is the first release
# with `run_plan_observing_reporting_failure` and the `Observation` seam behind
# it, which is the *whole* of a turn rather than its tool half — the instruction
# the turn is answering, each party's own reply, and that one turn's usage and
# bounds. Below it none of `Observation`, `TurnOpened`, `TurnMessage` or
# `TurnClosed` exists and `ToolEvent` carries neither `output` nor
# `tool_call_id`, so `src/judge.rs` does not compile. What it buys an operator is
# what `docs/contract.md` now describes: a live dispatch that shows what the agent
# did, what it said, and what each turn cost — none of which a journal could carry
# while this crate received only the tool half and discarded even the events in it
# that named no tool.
#
# 0.5.3 is the eighth raise, and it buys two things at once — which is the whole
# reason it moves in lockstep with the `oneharness-core` requirement below.
#
#   1. **0.5.2's reply fix, which is inert below it.** onejudge's oneharness
#      provider used to substitute the harness process's raw stdout for a reply
#      whose reported text was empty, so a completed turn that said nothing
#      published its own wire framing as the agent's words — and a user turn's
#      instruction *is* the transcript's last message, so the exhaust was
#      re-inlined into the next prompt as well as published. Measured on this
#      host before the bump: a 699 MB single event line whose model-authored
#      content was 0 characters, a 3.6 GB run journal behind it, and a read-only
#      listing verb needing 5.7 GB of RSS. This crate relays that reply verbatim
#      (`Observation::Message` -> `turn-message`, `Observation::TurnOpened` ->
#      `turn-started`), so it is this crate's stream the fix lands on and this
#      crate's journey that proves it:
#      `tests/e2e/dispatch.rs::a_turn_that_reported_no_text_relays_nothing_rather_than_the_harnesss_output`,
#      which fails against 0.5.0 with the whole stream-json transcript in the
#      `turn-message` payload.
#   2. **One `oneharness-core` in the graph.** 0.5.3 is the first release that links
#      0.12.0. Every release from
#      0.3.9 to 0.5.2 asked for 0.8, so this crate's own lockfile resolved
#      `oneharness-core` twice and every fix landed in 0.9-0.12 reached only half
#      of the tree — the half onejudge does not drive.
#
# 0.5.4 is the ninth raise: its published requirement moves onejudge to
# `oneharness-core` 0.12.1, whose Codex app-server parser now normalizes the
# controlled turn's tool events. Without both releases, a judged Codex turn can
# do work while this crate's `Observation::Tool` path and run journal see none
# of it. Re-read on 2026-08-26 in the published sources: onejudge's `TurnEvents`
# still forwards each `ActionEvent` through the live callback, and its manifest
# takes 0.12.1, so the parser fix reaches the two-party side this crate drives.
#
# 0.6.0 is the tenth raise, and like 0.4.0 it is not a compile floor — every call
# above still resolves against 0.5.4. It is taken because onejudge's own settling
# rule was ending the one member shape a graph runs to *keep* something alive.
# Two consecutive quiet exchanges — no tool events, both messages short, the same
# reply again — settle the conversation, which is a stalled loop everywhere except
# an observer whose *contract* is to report nothing, and there it is a healthy
# watch: a measured run lost its monitor five minutes in and ran roughly two hours
# unwatched while every indicator stayed green, because a member that settled is a
# member that finished and its loss announces itself nowhere. 0.6.0 adds
# `user.settle_on_noop`, defaulting to `true`, so no existing config changes
# behaviour; a base config that writes `false` keeps the streak measured and stops
# it ending the run, with `max_turns` still the bound. What is decided here is not
# the loop — that is onejudge's, with onejudge's coverage — but that the setting is
# *reachable*: an operator writes it in the base config their `kind: onejudge`
# member names, and this crate is what reads that file, merges a persona over it,
# and builds the plan, so a key dropped on the way through would read as configured
# and change nothing. `tests/e2e/dispatch.rs`'s
# `a_base_configs_settle_on_noop_reaches_the_loop_the_member_runs` drives one quiet
# conversation twice through the real member and reads the difference off the turns
# it was allowed to take.
#
# 0.6.1 carried nothing this crate compiled against; it was taken for being the
# newest 0.6.
#
# 0.7.0 is the twelfth raise and a **compile floor**: it publishes
# `onejudge::note` — the conversation half of the approved delivery-seam contract
# — and nothing above resolves below it. `Notes::channel` opens the two ends,
# `Plan::with_notes` hands the engine's end to the run driver `crate::judge`
# already uses, and `Notes::send` answers one note. The routing has to be the
# engine's because only it knows which side is live, and no 0.6 seam lets an
# embedder put a word in the transcript the judge is shown. `crate::note` records
# what each disposition means.
#
# 0.8.1 was the thirteenth raise, taken for what it links: its published
# requirement is `oneharness-core` `^0.13.0`, the release that runs a controlled
# codex turn under its candidate's model and refuses one the server would run
# elsewhere (see the `oneharness-core` block below). The core release is a
# pre-1.0 minor, so the `^0.12.1` that used to sit here excluded it and a lock
# refresh alone could not take it: the two requirements are edited together
# because a graph asking for 0.12 on one side and 0.13 on the other resolves
# both — the two-copies state `tests/inventory.rs` exists to refuse.
#
# **0.10.0 is the compile floor.** It is the release whose judge side is a *list
# of judges* — a panel — rather than one provider, and everything a
# `kind: onejudge` member's `judge:` list composes onto lives in it and in
# nothing before it:
#
#   1. `provider.judges: [...]` on a `kind: split` provider, with `judge:` as the
#      one-element shorthand, each entry an ordinary provider config plus an
#      optional `label` (`[A-Za-z0-9_-]+`, unique in the list, defaulted from the
#      kind). Every judge runs against each worker turn concurrently, and the
#      worker is handed one attributed message. A panel of one is byte-identical
#      to the bare provider it replaces, which is what keeps every single-judge
#      graph here running as it did.
#   2. `kind: llmlint`, a judge that is one `llmlint` run over the worker's tree
#      rather than a model's opinion — `bin`, `config`, `diff_base`, `args` —
#      valid only as a judge entry, probed at plan build so an absent executable
#      is a config error before any turn and never a silent pass.
#   3. `Observation::JudgeDecided { turn, judge, kind, decision, reason }`, one
#      per judge per supervisor turn, which `src/judge.rs` relays as this crate's
#      `judge-decided` event. The seam is exhaustive, so below 0.10.0 that arm
#      does not compile.
#   4. Report schema 12: `judge_decisions` on the report and on `RunFailure`,
#      and a `judge` label on every per-judge attribution, session link and
#      spawned process — the shape `member-settled`'s artifact now carries.
#
# Its `oneharness-core` requirement is still `^0.13.0`, so the one-copy rule
# below holds unchanged. 0.9.0, carried along, is the panel without the llmlint
# kind. What is decided here is not how a panel decides — that is onejudge's,
# with onejudge's coverage, stated in its `docs/judges.md` — but that a graph on
# this host can reach it: `src/config.rs` reads the list, `src/invoke.rs`
# composes it onto `judges:`, and `tests/e2e/panel.rs` drives a real stacked
# panel through the doubles and reads the config it was launched with.
#
# 0.11.0 is the fifteenth raise, and it is what is linked; every call above
# still resolves against 0.10.0, so the compile floor stays there. It is taken
# for `user.artifacts`: a list of files or directories every judge-side prompt
# names to read directly, relative ones against the evidence worktree, replaced
# by `ONEJUDGE_ARTIFACTS`. A judge left to find a design document through git
# never sees one that is gitignored, and loops on a question it cannot answer;
# below 0.11.0 the key is a `deny_unknown_fields` refusal instead. This crate adds
# no schema for it — the persona merge copies `user.*` over the base and the plan
# is onejudge's own — so what is decided here is that it arrives:
# `tests/e2e/dispatch.rs`'s
# `named_artifacts_reach_the_judge_from_a_persona_a_base_or_the_environment`
# reads it off the supervisor's prompt from a persona, a base, and the
# environment. Its `oneharness-core` requirement is still `^0.13.0`.
#
# **0.12.0 is the compile floor again, and it moves in lockstep with the two
# `onemessagebus` requirements below.** It is the release that stopped declaring
# the note contract and its channel: `onejudge::note` is now a re-export of
# `onemessagebus_agent::note`, `Notes` and `NoteInbox` are the bus's own `Sender`
# and `Inbox`, and `Notes::send` answers the bus's `Undelivered`. Below it
# `src/note.rs` does not compile, and above the bus requirement it asks for the
# graph would carry a second bus — two `Note` types that look alike and are not
# the same type, which `tests/inventory.rs` refuses against the lockfile.
#
# 0.13.0 is the seventeenth raise. It speaks protocol v8 to command judges: each
# supervisor request carries the agent turn's typed outcome, and a lost turn is
# offered to that command before onejudge classifies the run or opens the next
# agent turn. This crate does not derive that outcome; its command-judge e2e
# drives the composed member and records onejudge's own frame.
onejudge = { version = "0.13.0", features = ["cli"] }
# llmlint: ignore-end[changed_behavior_has_e2e]
# The stack's typed message bus, linked rather than restated. The envelope, its
# labels and sources, the filter grammar, the payload bounds and redaction, the
# emitter that numbers a stream, and the schema registry are `onemessagebus`'s
# and its agent profile's; `src/event.rs` re-exports them at the paths this crate
# has always published. The note spool a two-party member binds is the bus
# inbox's `Spool` backend. `docs/contract.md` names the bus's own contract as the
# source of the envelope section it quotes.
#
# 0.7.0 of both, and exactly the version `onejudge` 0.13.0 asks for, so one bus
# serves this crate and the conversation it drives. This is the configured-
# binding release: the bus no longer owns the onejudge codec.
onemessagebus = "0.7.0"
onemessagebus-agent = "0.7.0"
# The payload structs are registered with the bus's schema registry as
# `Message` types, which is a `schemars` derivation. The same major and feature
# the bus itself takes, so the one `JsonSchema` trait is the bus's.
schemars = { version = "1", features = ["preserve_order"] }
# The engine a `kind: oneharness` member's turn runs on, and its typed report.
#
# **0.10.1 is the compile floor.** It is the first release with
# `io::run::run_supervised` and `io::runner::ProcessSupervisor` — the hooks that
# put each harness child into the member's process group / job object — so below
# it `src/harness.rs` deliberately does not build. Both names are unchanged at
# 0.13.0; that was re-measured for this bump rather than assumed, and
# `tests/inventory.rs` holds `docs/oneharness-library.md` against it.
#
# **0.13.0 is what is linked, and it is linked exactly once.** It is the release
# that runs a controlled codex turn under its candidate's model: the app-server
# names the model a thread will run under on its `thread/start` / `thread/resume`
# response, before any token is spent, and 0.13.0 reads it — `RunResult` and
# `HistoryRunRecord` carry it as `observed_model`, `null` on every path that
# reports none — and refuses the turn when it differs from the one requested.
# That refusal is the ninth `FailureKind`, `model_mismatch`, and the chain steps
# past it as `model-mismatch`, a precondition fall-through like
# `untrusted_directory` and `input_too_large`. Below it a config that names one
# model spends another, and the chain never notices; this crate's
# `fallback-advanced` already publishes every stepped-past reason off
# `FallbackReport` as the type it is, so the new reason reaches the stream
# without an edit — `tests/e2e/selection.rs` drives a chain through it.
#
# This crate used to ask for 0.10 while onejudge asked for 0.8, so the graph
# carried two copies and every oneharness fix released into 0.9-0.12 reached only
# the half onejudge does not drive — a fix nobody had, on the side that needed
# it. onejudge 0.11.0 asks for `^0.13.0`, which the 0.13.0 here satisfies out of
# that one copy, which is why the two requirements move together and why neither
# may be bumped past what the other admits: split them again and the second copy
# comes back — which `tests/inventory.rs` asserts against the committed lockfile,
# since nothing else here can see a copy that is not this crate's own
# requirement. The rule that went with the split is retired with it, because
# there is no longer a second set of types to confuse this one with; what remains
# true is the ordinary one — a value onejudge hands back is onejudge's own type.
oneharness-core = "0.13.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, so a re-serialized
# envelope carries its payload's fields in the order they arrived — what the
# contract's "deterministic rendering" promise needs from the JSON mode.
serde_json = { version = "1", features = ["preserve_order"] }
# The graph config is YAML. serde_norway is the maintained fork of the
# deprecated serde_yaml; `cargo deny` is what keeps that choice honest.
serde_norway = "0.9"
thiserror = "2"
# A remote ref is recorded content-addressed, so replay never depends on the URL
# staying stable — that record is a SHA-256 of the exact bytes fetched.
sha2 = "0.10"
# Fetching those remote refs, over `rustls` so the TLS stack itself is the same on
# every CI leg the matrix runs.
#
# `platform-verifier` makes the *trust anchors* the host's own rather than the
# Mozilla set compiled into `webpki-roots`. That is a deliberate trade, and it cuts
# both ways: a graph served from an internal host under a private CA — or through a
# TLS-inspecting proxy — resolves without this crate having to grow a trust knob of
# its own, which is the environment a config-by-URL feature actually lands in; and
# `SSL_CERT_FILE` / `SSL_CERT_DIR` become the documented way to name a bundle,
# which is what `tests/e2e/remote.rs` uses to serve a real HTTPS graph to the real
# fetch path. The cost is that trust now depends on the host: a machine whose store
# is empty or misconfigured fails where the compiled-in set would have worked, and
# a CA an operator installed for interception is one this crate honours. That is
# how `curl` and `git` behave, and it is the behaviour an operator can inspect and
# change; a private set nothing on the host can see is not.
ureq = { version = "3", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
# A side's `model` override is stamped into that side's resolved oneharness
# config; `toml_edit` keeps the rest of the operator's file — comments included —
# byte-identical, so the copy in the run record still reads as what they wrote.
toml_edit = "0.23"
# Scratch ownership is an `owner.lock` flock plus a pid-with-start-token, and
# reaping a member's descendants is a signal to a proven process group. All four
# are kernel facilities with no safe-Rust equivalent in std.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same four facilities on Windows, which has none of the POSIX ones: the
# ownership lock is `LockFileEx`, the start token is `GetProcessTimes`, and both
# the grouping and the teardown of a member's process tree are a job object —
# the only thing on this platform that holds a descendant whose parent has
# already exited. `src/scratch.rs` documents the mapping and what differs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# A real HTTPS origin for the remote-ref journeys: `rcgen` mints a throwaway CA and
# a `localhost` leaf, and `rustls` serves them to the compiled binary's own fetch
# path. Dev-only, so nothing here reaches a consumer's build; the point is that the
# transport under test is the production one, reached over a real socket.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Recomputing the digest the run record claims, so the assertion is against what an
# auditor would compute rather than against the code under test. Already a normal
# dependency, so this adds nothing to the graph.
sha2 = "0.10"
# The canonical release-target schema, as the one implementation that defines it.
# `release-targets.toml` at this root is written against a schema six repositories
# share, and `tests/release_declaration.rs` holds this repository's document to it
# by calling `onevcs::validate_release_declaration` — the reader `onevcs`'s own
# `docs/contract.md` documents beside the schema. A copy of those rules kept here
# would be the defect the shared format exists to remove: a mirror drifts, and a
# document that passes the mirror is still refused by the tool that reads it.
#
# 0.16.0 is the floor because it is the release that first exposes that reader;
# below it neither `validate_release_declaration` nor `Declaration` exists. The
# **library** rather than the `onevcs` binary, for the reason this crate drives
# onejudge in-process: the reader answers a value a test can assert on, it is
# pinned by `Cargo.lock` rather than by whatever is on a machine's `PATH`, and it
# needs nothing installed for the gate to run offline on every platform leg.
# Dev-only — nothing here reaches a consumer's build.
onevcs = "0.16.0"

[[test]]
name = "e2e"
