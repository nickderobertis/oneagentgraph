  #
  # Pooled over the whole corpus that is 1688 monitor turns over 166.46 run-hours, an
  # average of 10.1 turns/hour, and the per-run rates above run from 0.1 to 29.7.
  #
  # THE LENGTH COVERED. 35.04 hours — `issue-92-federated-payload`, the longest run in
  # that corpus. It is the corpus's own maximum rather than a length chosen here.
  #
  # THE ARITHMETIC, from those per-run rates. The highest of them is 29.7 turns/hour
  # (`tanstack-start-mf-spike`, 151 turns over 5.0920 hours), so a monitor watching the
  # longest run in the corpus at the fastest per-run rate the corpus holds takes
  # 29.7 x 35.04 = 1041 turns — 1039 from the unrounded 29.6542 and 35.0418, which is
  # the figure to recheck against. That is the covered-turn count this ceiling has to
  # exceed, and 4500 exceeds it four times over.
  #
  # A SECONDARY AND DELIBERATELY CONSERVATIVE MARGIN, which is why the value is not set
  # nearer that count. Every per-run rate above is depressed by the dead time between
  # conversations, and that dead time is the very thing this change removes: the monitor
  # no longer stops at the ceiling and waits for a restart, so it goes on taking turns
  # at the rate a live conversation actually sustains. The fastest of those here is
  # 127.2 turns/hour — `root-causes-94-plan`, 50 turns in 23.6 minutes, the fastest of
  # the 21 conversations in this corpus that reached the old 50-turn ceiling and so the
  # longest un-truncated measurements this host holds. A monitor sustaining that for
  # 35.04 hours would take 127.2 x 35.04 = 4457 turns, and 4500 exceeds that too. Read
  # the first number as what the corpus says and this one as the headroom the declared
  # value buys.
  #
  # THE PACED RATE, which is what the arithmetic above now stands beside. Every rate in
  # the corpus was measured while the conversation took its next turn the moment the
  # judge answered — one every 23–60 seconds, 127.2 an hour at the fastest. The
  # `schedule: {every: 300}` graphs/dag-scope.yaml now declares on this member holds the
  # conversation 300 seconds between the judge's answer and the next agent turn, so the
  # sustained rate is at most 12 turns an hour — a hold ends early on a manager's note
  # or a trigger, so a turn can come sooner, and the ceiling is read against the rate
  # that is possible rather than the one that is usual. At 12 turns an hour, 4500 turns
  # is 375 hours of watching: nearly eleven times the 35.04-hour longest run in the
  # corpus, and the 1041 covered turns above become 175 at the paced rate.
  #
  # STILL FINITE, and deliberately. This is what a wedged or looping conversation is
  # bounded by — one that keeps ending its holds early, or a schedule overridden small
  # with `--set members.monitor.schedule.every` — and at the unpaced 127.2 turns an hour
  # it is still the roughly 35 hours of watching the corpus derived it from, so the
  # value stays. Do not raise it to unbounded: the sibling `check-in` member keeps a
  # finite deadline for the same reason, and a supervisory turn under no bound at all
  # fails silently. Raising it further is a matter of re-taking the rates and the
  # covered length above against a corpus with a longer run in it.
  max_turns: 4500
