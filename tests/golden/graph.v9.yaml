version: 9
name: node-scope
env:
  MY_VAR: value
personas: ./personas
events:
  filter:
    include:
    - kind: member-*
    - source: agentgraph
      member: worker
      persona: engineer
    exclude:
    - kind: turn-activity
members:
  reporter:
    kind: oneharness
    oneharness_config: ./oneharness.toml
    persona: ./reporter.yaml
    schedule:
      every: 1800
      start_after: 1800
      resettable: true
    background: true
    pre_turn:
    - command:
      - ./views/queue-depth
      - --json
      label: queue
      timeout: 20
  worker:
    kind: onejudge
    base_config: ./onejudge.base.yaml
    persona: engineer
    agent:
      oneharness_config: ./oneharness.toml
      stream: true
    judge:
      oneharness_config: ./oneharness.judge.toml
    mode: bypass
    dir: ./api
    schedule:
      every: 300
      start_after: 0
      resettable: false
    background: false
