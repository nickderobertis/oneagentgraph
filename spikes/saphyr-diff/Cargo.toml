# Throwaway differential harness for the serde-yaml-replacement spike: it never
# lands. A member of the root workspace, resolved against the root `Cargo.lock`;
# the root lists only itself in `default-members`, so nothing here reaches
# `just check`.

[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
oneagentgraph = { path = "../..", version = "0.5.6" }
onejudge = { version = "0.19.0", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"
saphyr-parser = "=0.2.1"
tempfile = "3"
