name: tmp-windows-stress
on: pull_request
jobs:
  stress:
    runs-on: windows-latest
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: taiki-e/install-action@v2
        with: {tool: "just,nextest"}
      - run: just bootstrap
      - run: cargo nextest run --locked --all-features --test e2e --no-run
      - name: drain journey, repeated
        continue-on-error: true
        run: cargo nextest run --locked --all-features --test e2e -E 'test(a_group_has_ended_every_process) | test(a_group_reaps_a_descendant)' --stress-count 40 --no-fail-fast --status-level fail
      - name: overlap probe
        continue-on-error: true
        env: {OVERLAP_PROBE: "1"}
        run: cargo nextest run --locked --all-features --test e2e -E 'test(a_chain_waits_for)' --stress-count 10 --no-fail-fast --status-level fail
